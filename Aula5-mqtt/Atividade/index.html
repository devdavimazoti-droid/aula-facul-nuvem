<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Sensores IoT</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #777;
            --primary: #007bff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        #status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            background-color: #ffeeba;
            color: #856404;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-top: 0;
            color: var(--text-muted);
            font-size: 1.2em;
        }
        .valor {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        .unidade {
            font-size: 0.4em;
            color: var(--text-muted);
        }
        .timestamp {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 15px;
        }
        /* Cores específicas para cada sensor */
        #card-temp .valor { color: #e74c3c; }
        #card-umid .valor { color: #3498db; }
        #card-pres .valor { color: #9b59b6; }
        #card-solo .valor { color: #27ae60; }
        #card-co2 .valor { color: #f39c12; }
    </style>
</head>
<body>

    <header>
        <h1>Monitoramento IoT Central</h1>
        <div id="status">Conectando ao WebSocket...</div>
    </header>

    <div class="dashboard">
        <!-- Cards dos Sensores -->
        <div class="card" id="card-temp">
            <h3>🌡️ Temperatura</h3>
            <div class="valor" id="val-temp">-- <span class="unidade">°C</span></div>
            <div class="timestamp" id="time-temp">Aguardando dados...</div>
        </div>

        <div class="card" id="card-umid">
            <h3>💧 Umidade do Ar</h3>
            <div class="valor" id="val-umid">-- <span class="unidade">%</span></div>
            <div class="timestamp" id="time-umid">Aguardando dados...</div>
        </div>

        <div class="card" id="card-pres">
            <h3>🌬️ Pressão Atmosférica</h3>
            <div class="valor" id="val-pres">-- <span class="unidade">hPa</span></div>
            <div class="timestamp" id="time-pres">Aguardando dados...</div>
        </div>

        <div class="card" id="card-solo">
            <h3>🌱 Umidade do Solo</h3>
            <div class="valor" id="val-solo">-- <span class="unidade">%</span></div>
            <div class="timestamp" id="time-solo">Aguardando dados...</div>
        </div>

        <div class="card" id="card-co2">
            <h3>💨 Nível de CO2</h3>
            <div class="valor" id="val-co2">-- <span class="unidade">ppm</span></div>
            <div class="timestamp" id="time-co2">Aguardando dados...</div>
        </div>
    </div>

    <script>
        // Conectar ao servidor Python via WebSocket
        const socket = new WebSocket("ws://localhost:8765");
        const divStatus = document.getElementById("status");

        socket.onopen = () => {
            divStatus.textContent = "🟢 Conectado ao Servidor (Ao Vivo)";
            divStatus.style.backgroundColor = "#d4edda";
            divStatus.style.color = "#155724";
        };

        socket.onclose = () => {
            divStatus.textContent = "🔴 Desconectado. Verifique o Python.";
            divStatus.style.backgroundColor = "#f8d7da";
            divStatus.style.color = "#721c24";
        };

        socket.onmessage = (event) => {
            try {
                // Tenta converter a mensagem recebida para JSON
                const dados = JSON.parse(event.data);
                
                // Mapeia o tópico/sensor para atualizar o card correto na tela
                const agora = new Date().toLocaleTimeString();

                // Supondo que o JSON venha com a chave 'sensor' indicando de qual é
                if (dados.sensor === "temperatura") {
                    document.getElementById("val-temp").innerHTML = `${dados.medicao} <span class="unidade">${dados.unidade}</span>`;
                    document.getElementById("time-temp").textContent = `Atualizado às ${agora}`;
                } 
                else if (dados.sensor === "umidade") {
                    document.getElementById("val-umid").innerHTML = `${dados.medicao} <span class="unidade">${dados.unidade}</span>`;
                    document.getElementById("time-umid").textContent = `Atualizado às ${agora}`;
                }
                else if (dados.sensor === "pressao") {
                    document.getElementById("val-pres").innerHTML = `${dados.medicao} <span class="unidade">${dados.unidade}</span>`;
                    document.getElementById("time-pres").textContent = `Atualizado às ${agora}`;
                }
                else if (dados.sensor === "umidadeSolo") {
                    document.getElementById("val-solo").innerHTML = `${dados.medicao} <span class="unidade">${dados.unidade}</span>`;
                    document.getElementById("time-solo").textContent = `Atualizado às ${agora}`;
                }
                else if (dados.sensor === "CO2") {
                    document.getElementById("val-co2").innerHTML = `${dados.medicao} <span class="unidade">${dados.unidade}</span>`;
                    document.getElementById("time-co2").textContent = `Atualizado às ${agora}`;
                }

            } catch (error) {
                console.error("Erro ao processar mensagem do WebSocket:", error);
            }
        };
    </script>
</body>
</html>
